project:
  name: canatune-exp
  mode: disaggregated_inference
  work_dir_root: /path/to/vllm_job_work
  broker_root: /path/to/job_broker

slurm:
  partition: long
  time_limit: "16:00:00"
  nodes: 2
  cpus_per_gpu: 8
  exclusive: true

runtime:
  python: /path/to/python
  vllm_version: "0.15.1"
  offline: true
  environment:
    HF_HUB_OFFLINE: "1"
    TRANSFORMERS_OFFLINE: "1"
    NCCL_IB_DISABLE: "1"
    NCCL_SOCKET_IFNAME: "^lo"
    NCCL_DEBUG: INFO

model:
  name: mistralai/Mistral-7B-v0.1
  snapshot_root: /path/to/model/snapshots
  path_override_env: MODEL_OVERRIDE
  max_model_len: 4096

topology:
  ip_resolution:
    method: slurm_hostname_I_first_address
    hardcode_ip: false

  prefill_nodegroup:
    node: prefill-node
    gpu_type: NVIDIA L40S
    endpoint_prefix: P
    gpu_ids: [0, 1, 2, 3]
    http_port_base: 8100
    kv_port_base: 14579
    high_frequency_mhz: 2520
    memory_frequency_mhz: 9001

  decode_nodegroup:
    node: decode-node
    gpu_type: NVIDIA L4
    endpoint_prefix: D
    gpu_ids: [0, 1, 2, 3]
    http_port_base: 8200
    kv_port_base: 14579
    high_frequency_mhz: 1500
    memory_frequency_mhz: 6251
    gpu_memory_utilization: 0.82

  endpoints:
    P0: {role: prefill, gpu_id: 0, http_port: 8100, kv_port: 14579}
    P1: {role: prefill, gpu_id: 1, http_port: 8101, kv_port: 14580}
    P2: {role: prefill, gpu_id: 2, http_port: 8102, kv_port: 14581}
    P3: {role: prefill, gpu_id: 3, http_port: 8103, kv_port: 14582}
    D0: {role: decode, gpu_id: 0, http_port: 8200, kv_port: 14579}
    D1: {role: decode, gpu_id: 1, http_port: 8201, kv_port: 14580}
    D2: {role: decode, gpu_id: 2, http_port: 8202, kv_port: 14581}
    D3: {role: decode, gpu_id: 3, http_port: 8203, kv_port: 14582}

kv_transfer:
  connector: P2pNcclConnector
  prefill_role: kv_producer
  decode_role: kv_consumer
  prefill_send_type: PUT_ASYNC  # K1b: TTFT 25-38 % lower than PUT
  disable_prefix_cache: true
  disable_chunked_prefill: true

proxy:
  enabled: true
  host: 127.0.0.1
  port: 8000
  endpoint: /v1/completions
  diagnostics_log: "${raw_root}/launcher/proxy_diagnostics.jsonl"

routing:
  # round_robin: baseline (production pairs in turn, no admission, no clock control).
  # cantune: risk-based admission + tier Controller + telemetry + Canary API.
  policy: round_robin
  canary_pair: [P0, D0]       # group G0
  production_pairs:           # groups G1..G3; P_i/D_i are fixed pairs in v1
    - [P1, D1]
    - [P2, D2]
    - [P3, D3]
  allow_production_cross_pairs: false

# Per-request admission (design v2 section 5.2).
router:
  theta: 0.10                 # admit only when the cell's violation risk <= theta
  max_wait_ms: 300            # bounded wait inside the TTFT budget (covers waking a parked group)
  retry_period_ms: 20
  snapshot_max_age_s: 1.0     # older /metrics snapshots count as unknown (unsafe)
  d_busy_min_running: 1       # D counts as busy with >= this many running sequences
  chars_per_token: 4          # estimate for text prompts; such samples skip the table

telemetry:
  enabled: true
  period_s: 0.25              # /metrics scrape period for all endpoints

# Group control (design v2 section 5.1). No clocks or thresholds are configured:
# the Canary publishes tiers (park, H, optional L), C_H, alpha and the D wall.
# Loads are equivalent prompt tokens/s = sum(prompt tokens + alpha) / window.
controller:
  period_s: 1.0
  load_window_s: 10.0
  t_down_s: 30                # sustained low load before parking / L down-shift
  wake_load_fraction: 0.85    # wake a parked group above 0.85 C_H mean active load
  park_load_fraction: 0.7     # park one when the rest carry the total at <= 0.7 C_H
  min_active_groups: 1
  stagger_s: 2.0              # groups move to a new tier one at a time
  energy_log_period_s: 5

# Online risk table R(clock point, N_await, L_in, D busy) (design v2 section 4.1).
# Starts empty on a new cluster; production runs at MAX and admits everything
# until the Canary has published tiers and filled the H cells.
risk:
  n_await_edges: [0, 1, 2, 3, 5]           # buckets 0,1,2,3,4-5 and >5
  prompt_token_edges: [128, 512, 1024, 2048]  # buckets <=128 ... <=2048 and >2048
  min_samples: 20
  path: null                  # or set CANATUNE_RISK_TABLE
  seed: {}                    # optional {"1815/1050": 6x5 matrix}; not used by default

clock_control:
  enabled: false              # true: lock clocks through the per-node GPU agents
  agent_port: 9300
  agents:                     # or CANATUNE_PREFILL_AGENT / CANATUNE_DECODE_AGENT
    prefill: null
    decode: null
  min_mhz:                    # agents refuse lower clocks; the Canary never probes below
    prefill: 600
    decode: 300

# Canary (design v2 section 6): experiment scheduling, tier locator, probes.
canary:
  tier_table_path: null       # or set CANATUNE_TIER_TABLE; keyed by config identity
  default_lengths:            # (prompt, output) pairs until 50 real requests finished
    - [128, 64]
    - [512, 64]
    - [1024, 64]
    - [2048, 64]
  length_min_samples: 50
  # scheduler
  period_s: 1.0
  quiet_s: 60                 # no Router rejection for this long before switching out
  others_load_max: 0.7        # rest of the pool must carry production at <= 0.7 C_H
  min_interval_s: 600
  max_duty: 0.10              # at most 10 % of the time experimenting
  periodic_s: 1800            # neighbour check of H
  length_shift: 0.30          # median/p90 change that triggers a P relocation
  drift_min_samples: 200
  drain_timeout_s: 30
  locator:
    eps: 0.02                 # energy band: within 2 % of the minimum
    target_load_fraction: 0.8 # search at 0.8 C0 (consolidated operating point)
    low_load_fraction: 0.3    # second load for the one-or-two-tiers check
    fill_load_fractions: [0.3, 0.5, 0.8, 1.0]
    fill_bisect_steps: 2      # C_H between the fill loads (bisection)
    window_s: 20
    min_window_requests: 60   # violation bound with 0/60 is ~3 %
    max_window_s: 120
    idle_window_s: 5
    coarse_points: 5
    refine_steps: 3
    limited_fraction_max: 0.3 # skip clocks power/thermal-limited > 30 % of busy time
    decode_probe_concurrency: 16
    decode_start_concurrency: 8
    decode_load_fraction: 0.7 # choose the D clock at 0.7 B*
    decode_wall_tolerance: 0.25
    decode_kv_limit: 0.90
  probe:
    settle_s: 2.0
    sample_period_s: 0.25
    prefill_min_mhz: 600
    decode_min_mhz: 300

cache:
  root: "${work_dir}"
  hf_home: "${work_dir}/huggingface"
  hf_hub_cache: "${work_dir}/huggingface/hub"
  torch_home: "${work_dir}/torch-cache"
  triton_cache: "${work_dir}/triton-cache"
  cuda_cache: "${work_dir}/cuda-cache"
  vllm_cache: "${work_dir}/vllm-cache"
  flashinfer_workspace: "${work_dir}/flashinfer"
  tmp_dir: "${work_dir}/tmp"

artifacts:
  raw_root: "${work_dir}/raw"
  result_root: "${broker_job_dir}/results/${slurm_job_id}"
  server_logs: "${raw_root}/launcher"
  frequency_table: "${raw_root}/frequency_table.json"
  route_control: "${raw_root}/production_route_control.json"

experiment:
  smoke_gate:
    enabled: true
    endpoint_pair: [P0, D0]
    required_before_formal_measurement: true

  slo:
    # 1000 ms: >= the idle p95 of the longest prompt in this P/D setup (K4a: 733 ms);
    # 500 ms is missed even with nothing queued (0930 report, section 6).
    ttft_ms: 1000
    tpot_ms: 200

  workload:
    request_timeout_s: 900
    max_concurrency: 1
    request_interval_s: 5

container:
  enabled: false
  runtime: apptainer
  image: /path/to/vllm.sif
  use_nvidia_runtime: true
  host_network: true
  mounts:
    - "${work_dir}:${work_dir}"
    - "${model_path}:${model_path}:ro"
    - "${source_root}:/workspace"
